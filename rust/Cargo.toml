[package]
name = "proteus"
version = "0.2.1"
edition = "2021"
description = "Proteus simulator backend"
license = "MIT"
publish = false

[lib]
name = "proteus"
path = "src/lib.rs"

[features]
default = []
rayon = ["dep:rayon"]
web = [
    "dep:axum",
    "dep:futures-util",
    "dep:tokio",
    "dep:tower-http",
]

[dependencies]
axum = { version = "0.7", features = ["http1", "json", "tokio", "ws"], optional = true }
fastrand = "2"
strum = { version = "0.26", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
rayon = { version = "1", optional = true }
rand_core = "0.6"
rand_distr = "0.4"
rand_xoshiro = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["cors", "set-header"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
rayon = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "proteus-server"
path = "src/bin/proteus-server.rs"
required-features = ["web"]

[[bin]]
name = "proteus-run"
path = "src/bin/proteus-run.rs"

[[bin]]
name = "proteus-batch"
path = "src/bin/proteus-batch.rs"

[profile.dev]
# The simulator is typically exercised via plain `cargo run`, so keep the
# default dev profile optimized instead of requiring `--release` everywhere.
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
all = "warn"
