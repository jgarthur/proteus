[package]
name = "proteus-mini"
version = "0.1.0"
edition = "2021"
description = "Proteus stripped back: tapes on a grid, a speed of light, and ticks"
license = "MIT"
publish = false

[dependencies]
# Only the high-order-entropy metric needs this; the substrate itself has no dependencies.
brotli = "9"

[profile.dev]
# Match the main crate: plain `cargo run` should already be fast.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
all = "warn"
